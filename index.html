<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1ede5">
  <meta name="description" content="Буквальный челлендж: одна кириллическая буква в день, нарисованная кодом.">
  <title>Буквальный челлендж / pustota</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=29">
</head>
<body>
  <main class="site-shell">
    <header class="masthead">
      <a class="wordmark" href="./" aria-label="Алфавит, на главную">pustota<span>.link</span></a>
      <div class="masthead-meta">
        <button class="wallet-badge" id="wallet-badge" type="button" hidden></button>
        <span>буквальный челлендж</span>
        <span>2026</span>
      </div>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <div class="intro-copy">
        <p class="eyebrow">кириллический алфавит</p>
        <h1 id="page-title">Каждый день<br>одна буква</h1>
        <p class="intro-text">Я рисую буквы кодом. Здесь они появляются по&nbsp;одной, превращаясь в&nbsp;маленькие интерактивные миры. Нажми на&nbsp;готовую букву, чтобы войти.</p>
      </div>
      <aside class="wall" id="wall" hidden aria-label="Холст буквы Я">
        <canvas id="wall-canvas"></canvas>
        <p class="wall-caption" id="wall-caption"></p>
      </aside>
    </section>

    <section class="alphabet-section" aria-labelledby="alphabet-heading">
      <div class="section-heading">
        <h2 id="alphabet-heading">Алфавит</h2>
        <p><span id="ready-count">0</span> из 33 готовы</p>
      </div>
      <div class="letter-grid" id="letter-grid" aria-label="Буквы русского алфавита"></div>
    </section>

    <footer class="site-footer">
      <span>буквы строятся в браузере</span>
      <a href="https://t.me/vse_pustoe" rel="me noopener" target="_blank">@vse_pustoe</a>
    </footer>
  </main>

  <dialog class="letter-dialog" id="letter-dialog">
    <div class="letter-workspace" id="letter-workspace">
      <canvas id="letter-canvas"></canvas>
      <div class="workspace-label" id="workspace-label"></div>
      <button class="dialog-close" type="button" data-close-dialog aria-label="Закрыть окно">×</button>
    </div>
  </dialog>

  <script type="module" src="app.js?v=59"></script>
  <script type="module" src="wall.js?v=12"></script>
</body>
</html>
