<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Г — полигон углов</title>
<style>
  :root { --paper: #f1ede5; --ink: #161616; --muted: #8b877f; --red: #e0210f; --mono: 'DM Mono', ui-monospace, monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; gap: 16px; padding: 20px; background: var(--paper); color: var(--ink); font: 400 11px/1.5 var(--mono); text-transform: uppercase; letter-spacing: .08em; }
  header, footer { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
  header b { font-weight: 500; letter-spacing: -.02em; text-transform: none; font-size: 14px; }
  .modes { display: flex; gap: 2px; }
  .modes button { border: 1px solid rgba(22,22,22,.18); padding: 6px 10px; background: none; color: var(--muted); font: inherit; text-transform: uppercase; letter-spacing: .08em; cursor: pointer; }
  .modes button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
  .stage { justify-self: center; align-self: center; position: relative; width: min(76vh, 100%); aspect-ratio: 1/1; border: 1px solid rgba(22,22,22,.18); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  footer { color: var(--muted); justify-content: space-between; }
  .tools { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .tools label { display: flex; gap: 6px; align-items: center; }
  .tools input[type=range] { width: 110px; }
  .tools button { border: 1px solid rgba(22,22,22,.18); padding: 5px 9px; background: none; color: var(--muted); font: inherit; text-transform: uppercase; letter-spacing: .08em; cursor: pointer; }
  .tools button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
  #note { color: var(--muted); text-transform: none; letter-spacing: .02em; }

  .back { color: var(--muted); text-decoration: none; letter-spacing: .08em; }
  .back:hover { color: var(--ink); }
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">полигоны</a>
  <b>Г / полигон углов</b>
  <div class="modes" id="modes"></div>
</header>

<div class="stage"><canvas id="c"></canvas></div>

<footer>
  <div class="tools" id="tools"></div>
  <span id="note"></span>
</footer>

<script src="g-lab.js?31"></script>
</body>
</html>
