<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ё — полигон точек</title>
<style>
  :root {
    --paper: #f1ede5;
    --ink: #161616;
    --muted: #8b877f;
    --line: rgba(22, 22, 22, .18);
    --red: #e0210f;
    --mono: 'DM Mono', 'SFMono-Regular', ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: 16px;
    padding: 18px 20px;
    overflow-x: hidden;
    background: var(--paper);
    color: var(--ink);
    font: 400 11px/1.45 var(--mono);
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  button, input { font: inherit; }

  header {
    min-width: 0;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 18px;
    align-items: start;
  }

  .identity {
    display: flex;
    align-items: center;
    gap: 12px;
    white-space: nowrap;
  }

  .identity b {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -.02em;
    text-transform: none;
  }

  .modes, .tools {
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .modes {
    min-width: 0;
    flex-wrap: wrap;
  }

  button {
    border: 1px solid var(--line);
    padding: 6px 9px;
    background: transparent;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .08em;
    cursor: pointer;
  }

  button:hover { border-color: var(--ink); color: var(--ink); }

  button[aria-pressed="true"] {
    border-color: var(--ink);
    background: var(--ink);
    color: var(--paper);
  }

  .stage-wrap {
    min-height: 0;
    display: grid;
    place-items: center;
  }

  .stage {
    position: relative;
    width: min(74vh, 100%);
    aspect-ratio: 1;
    border: 1px solid var(--line);
    background:
      linear-gradient(90deg, transparent 49.9%, rgba(22,22,22,.035) 50%, transparent 50.1%),
      linear-gradient(transparent 49.9%, rgba(22,22,22,.035) 50%, transparent 50.1%);
  }

  .stage::before {
    content: attr(data-index);
    position: absolute;
    z-index: 1;
    top: 9px;
    left: 11px;
    color: var(--muted);
    pointer-events: none;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  footer {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(220px, 38%);
    gap: 20px;
    align-items: end;
    color: var(--muted);
  }

  .tools {
    flex-wrap: wrap;
    gap: 8px 14px;
  }

  .tools label {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tools input[type="range"] {
    width: 96px;
    accent-color: var(--ink);
  }

  .tools output { min-width: 30px; }

  #note {
    max-width: 620px;
    justify-self: end;
    text-align: right;
    letter-spacing: .02em;
    text-transform: none;
  }

  @media (max-width: 760px) {
    body { padding: 12px; gap: 12px; }
    header { grid-template-columns: 1fr; gap: 10px; }
    .modes { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 3px; }
    .modes button { flex: 0 0 auto; }
    .stage { width: min(100%, 70vh); }
    footer { grid-template-columns: 1fr; }
    #note { justify-self: start; text-align: left; }
  }

  .back { color: var(--muted); text-decoration: none; letter-spacing: .08em; }
  .back:hover { color: var(--ink); }
</style>
</head>
<body>
<header>
  <div class="identity">
    <a class="back" href="index.html">полигоны</a>
    <b>Ё · две точки</b>
  </div>
  <nav class="modes" id="modes" aria-label="Механика"></nav>
</header>

<main class="stage-wrap">
  <div class="stage" id="stage" data-index="01 / 08">
    <canvas id="c"></canvas>
  </div>
</main>

<footer>
  <div class="tools" id="tools"></div>
  <span id="note"></span>
</footer>

<script src="yo-lab.js?38"></script>
</body>
</html>
